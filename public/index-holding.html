<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BespoxAI — Coming soon</title>
<meta name="description" content="BespoxAI — Microsoft Navision and Business Central services and development. Coming soon.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F4EFE4;
    --ink:#040E09;
    --jade:#0A5C46;
    --jade-bright:#1A9272;
    --amber:#E8A838;
    --muted:#5C6A61;
    --rule:#D6D9D4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:'DM Sans',sans-serif;
    font-weight:300;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .frame{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:48px 24px;
  }
  .eyebrow{
    font-family:'DM Mono',monospace;
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--jade);
    margin-bottom:28px;
    opacity:0;
    animation:rise .8s ease .1s forwards;
  }
  .wordmark{
    font-family:'Cormorant Garamond',serif;
    font-weight:400;
    font-size:clamp(52px,9vw,104px);
    line-height:1.02;
    letter-spacing:-0.01em;
    opacity:0;
    animation:rise .8s ease .25s forwards;
  }
  .wordmark .ai{color:var(--jade)}
  .services{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(19px,3vw,26px);
    color:var(--muted);
    margin-top:18px;
    opacity:0;
    animation:rise .8s ease .4s forwards;
  }
  .divider{
    width:64px;
    height:1px;
    background:var(--rule);
    margin:40px auto 36px;
    position:relative;
    opacity:0;
    animation:rise .8s ease .55s forwards;
  }
  .divider::after{
    content:'';
    position:absolute;
    top:-2.5px;
    left:0;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--amber);
    animation:trace 5s ease-in-out 1.4s infinite;
  }
  .contact{
    font-family:'DM Mono',monospace;
    font-size:13.5px;
    letter-spacing:0.04em;
    color:var(--muted);
    opacity:0;
    animation:rise .8s ease .7s forwards;
  }
  .contact a{
    color:var(--jade);
    text-decoration:none;
    border-bottom:1px solid var(--rule);
    transition:border-color .2s ease, color .2s ease;
  }
  .contact a:hover{color:var(--jade-bright);border-color:var(--jade)}
  .contact a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  footer{
    padding:22px 24px 28px;
    text-align:center;
    font-family:'DM Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes trace{
    0%{left:0}
    50%{left:58px}
    100%{left:0}
  }
  @media (prefers-reduced-motion: reduce){
    .eyebrow,.wordmark,.services,.divider,.contact{animation:none;opacity:1}
    .divider::after{animation:none}
  }
</style>
</head>
<body>
  <main class="frame">
    <div class="eyebrow">Coming soon</div>
    <h1 class="wordmark">Bespox<span class="ai">AI</span></h1>
    <p class="services">Microsoft Navision &amp; Business Central services and development</p>
    <div class="divider" aria-hidden="true"></div>
    <p class="contact">Contact — <a href="mailto:Admin@bespoxai.com">Admin@bespoxai.com</a></p>
  </main>
  <footer>&copy; 2026 BespoxAI</footer>
</body>
</html>
